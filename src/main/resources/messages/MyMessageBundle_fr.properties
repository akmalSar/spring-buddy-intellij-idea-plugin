inspection.constructor.to.builder.display.name=L\u2019appel au constructeur peut \u00EAtre remplac\u00E9 par un builder
inspection.constructor.to.builder.description=Signale les appels de constructeur sur les classes annot\u00E9es avec @Builder qui peuvent \u00EAtre remplac\u00E9s par le pattern builder de Lombok.
inspection.constructor.to.builder.fix.name=Remplacer par un builder
inspection.constructor.to.builder.problem.descriptor=L\u2019appel au constructeur peut \u00EAtre remplac\u00E9 par un builder
inspection.allargs.constructor.redundancy.display.name=@AllArgsConstructor redondant
inspection.allargs.constructor.redundancy.description=Signale les annotations @AllArgsConstructor redondantes car un constructeur tout-args explicite existe d\u00E9j\u00E0 et n\u2019est jamais utilis\u00E9, et supprimer l\u2019annotation ne casserait ni l\u2019injection Spring ni l\u2019initialisation des champs finaux.
inspection.allargs.constructor.redundancy.fix.name=Supprimer @AllArgsConstructor redondant
inspection.allargs.constructor.redundancy.problem.descriptor=Annotation @AllArgsConstructor redondante
inspection.builder.redundancy.display.name=@Builder inutilis\u00E9 ou redondant
inspection.builder.redundancy.description=Signale les annotations @Builder ou @SuperBuilder redondantes car une m\u00E9thode builder() explicite existe d\u00E9j\u00E0, ou inutilis\u00E9es car la classe n\u2019a aucune r\u00E9f\u00E9rence ni aucun appel builder dans le projet.
inspection.builder.redundancy.fix.name=Supprimer @Builder inutilis\u00E9/redondant
inspection.builder.redundancy.problem.descriptor.explicit=@Builder redondant \u2014 la classe d\u00E9clare d\u00E9j\u00E0 une m\u00E9thode builder() explicite
inspection.builder.redundancy.problem.descriptor.unused=@Builder inutilis\u00E9 \u2014 la classe n\u2019a aucune r\u00E9f\u00E9rence ni aucun appel builder dans le projet
inspection.builder.hierarchy.display.name=Probl\u00E8mes de hi\u00E9rarchie Lombok @Builder
inspection.builder.001.problem.descriptor=@Builder sur une classe parent exclura les champs parents des builders de sous-classes. Utilisez @SuperBuilder sur les classes parent et sous-classes.
inspection.builder.002.problem.descriptor=@Builder sur une sous-classe dont le parent a aussi @Builder provoque un conflit de constructeur \u00E0 la compilation. Utilisez @SuperBuilder sur les deux classes.
inspection.builder.003.problem.descriptor=@Builder est pr\u00E9sent mais le seul constructeur disponible couvre {0} champs alors que la classe d\u00E9clare {1} champs. Le builder laissera silencieusement les champs non appari\u00E9s \u00E0 null. Ajoutez un constructeur all-args ou d\u00E9placez @Builder explicitement sur le constructeur partiel.
inspection.builder.004.problem.descriptor=@Builder sur une sous-classe sans @SuperBuilder sur le parent exclut silencieusement tous les champs parents du builder. Utilisez @SuperBuilder sur les deux classes.
inspection.inheritance.shadow.display.name=Probl\u00E8mes d\u2019ombrage par h\u00E9ritage Lombok
inspection.inherit.001.problem.descriptor=Le champ {0} masque le champ parent du m\u00EAme nom. Cela cr\u00E9e deux emplacements m\u00E9moire distincts sur le m\u00EAme objet. Les lectures et \u00E9critures via une r\u00E9f\u00E9rence typ\u00E9e parent acc\u00E8dent silencieusement au mauvais champ.
inspection.inherit.002.problem.descriptor=Lombok g\u00E9n\u00E8re des getters/setters pour le champ masquant {0}, mais ils sont invisibles lorsque l\u2019objet est acc\u00E9d\u00E9 via le type parent. Retirez la red\u00E9claration du champ et annotuez le champ parent \u00E0 la place.
inspection.inherit.003.problem.descriptor=@AllArgsConstructor sur cette sous-classe ne couvre que les champs propres de la sous-classe. Les champs parents masqu\u00E9s resteront silencieusement null apr\u00E8s la construction.
inspection.inherit.004.problem.descriptor=L\u2019annotation de validation sur le champ masquant {0} ne se d\u00E9clenchera pas lorsque l\u2019objet est valid\u00E9 via une r\u00E9f\u00E9rence typ\u00E9e parent. La contrainte est effectivement invisible pour le framework dans ce cas.
inspection.eqh.display.name=Probl\u00E8mes Lombok @EqualsAndHashCode
inspection.eqh.001.problem.descriptor=@EqualsAndHashCode sur une sous-classe exclut les champs parents des v\u00E9rifications d\u2019\u00E9galit\u00E9 \u00E0 moins que callSuper = true soit d\u00E9fini. Deux objets diff\u00E9rant uniquement par les champs parents seront incorrectement consid\u00E9r\u00E9s comme \u00E9gaux.
inspection.eqh.002.problem.descriptor=@Data sur une sous-classe implique @EqualsAndHashCode sans callSuper = true, excluant silencieusement les champs parents de l\u2019\u00E9galit\u00E9. Utilisez @EqualsAndHashCode(callSuper = true) et @ToString(callSuper = true) explicites.
inspection.eqh.003.eqh.problem.descriptor=equals/hashCode g\u00E9n\u00E9r\u00E9s par Lombok avec des champs mutables cassent l\u2019identit\u00E9 d\u2019entit\u00E9 JPA, le suivi de session Hibernate et le comportement des collections. Impl\u00E9mentez equals/hashCode manuellement en utilisant uniquement l\u2019identifiant stable de l\u2019entit\u00E9.
inspection.data.display.name=Probl\u00E8mes Lombok @Data
inspection.data.001.problem.descriptor=@Data ne g\u00E9n\u00E9rera pas @AllArgsConstructor quand un constructeur est d\u00E9j\u00E0 d\u00E9fini. Seul @RequiredArgsConstructor est g\u00E9n\u00E9r\u00E9, ce qui peut ne pas correspondre \u00E0 l\u2019intention du d\u00E9veloppeur. Soyez explicite : utilisez @AllArgsConstructor si un constructeur complet est n\u00E9cessaire.
inspection.tostring.display.name=Probl\u00E8mes Lombok @ToString
inspection.tostring.001.problem.descriptor=@ToString sur une sous-classe exclut les champs parents de la repr\u00E9sentation sous forme de cha\u00EEne \u00E0 moins que callSuper = true soit d\u00E9fini.
inspection.tostring.002.problem.descriptor=Lombok @ToString peut provoquer un StackOverflowError \u00E0 cause d\u2019une r\u00E9f\u00E9rence circulaire entre {0} et {1}. Excluez un c\u00F4t\u00E9 en utilisant @ToString.Exclude.
inspection.constructor.display.name=Probl\u00E8mes d\u2019annotations de constructeur Lombok
inspection.constructor.001.problem.descriptor=JPA et Jackson requi\u00E8rent un constructeur sans arguments pour la d\u00E9s\u00E9rialisation et le proxying. Ajoutez @NoArgsConstructor aux c\u00F4t\u00E9s de @AllArgsConstructor.
inspection.constructor.002.problem.descriptor=@RequiredArgsConstructor g\u00E9n\u00E8re un constructeur sans arguments quand il n\u2019y a pas de champs finaux ou @NonNull. Cela est probablement involontaire. Utilisez explicitement @NoArgsConstructor pour signaler l\u2019intention.
inspection.nonnull.display.name=Probl\u00E8mes Lombok @NonNull
inspection.nonnull.001.problem.descriptor=Lombok @NonNull sur un champ primitif est d\u00E9pourvu de sens. Les primitives ne peuvent jamais \u00EAtre null. Retirez l\u2019annotation.
inspection.nonnull.002.problem.descriptor=@NonNull et @Builder.Default sur le m\u00EAme champ provoqueront une NullPointerException pendant la construction car la v\u00E9rification null s\u2019ex\u00E9cute avant que la valeur par d\u00E9faut ne soit appliqu\u00E9e.
inspection.builderdefault.display.name=Probl\u00E8mes Lombok @Builder.Default
inspection.builderdefault.001.problem.descriptor=@Builder.Default est contourn\u00E9 lorsque le constructeur all-args est utilis\u00E9 directement. La valeur par d\u00E9faut ne sera pas appliqu\u00E9e, et le champ contiendra la valeur pass\u00E9e \u2014 y compris null.
inspection.setter.builder.display.name=Lombok @Setter sur champ @Builder
inspection.setter.001.problem.descriptor=@Setter sur un champ dans une classe @Builder sapte l\u2019immutabilit\u00E9. Si le champ doit \u00EAtre mutable, documentez-le explicitement. Sinon, retirez @Setter.
inspection.manual.getter.display.name=M\u00E9thode manuelle masque le getter Lombok
inspection.manual.001.problem.descriptor=Lombok sautera la g\u00E9n\u00E9ration du getter pour {0} car une m\u00E9thode avec la m\u00EAme signature existe d\u00E9j\u00E0. Si la m\u00E9thode manuelle est supprim\u00E9e \u00E0 l\u2019avenir, le comportement changera silencieusement vers la valeur par d\u00E9faut de Lombok.
inspection.superbuilder.001.problem.descriptor=@SuperBuilder nécessite que la chaîne de superclasses utilise également @SuperBuilder. Ajoutez @SuperBuilder à la classe parente.
inspection.data.jpa.problem.descriptor=@Data on JPA entities is dangerous. It includes @EqualsAndHashCode and @ToString, which leads to broken collections, LazyInitializationException, StackOverflowError, and identity issues. Use explicit @Getter + @Setter (or @Value for DTOs) instead.
inspection.builder.jpa.problem.descriptor=@Builder on a JPA entity removes the no-args constructor required by JPA/Hibernate. Always combine with @NoArgsConstructor(force = true) or put @Builder on a static method / constructor.
inspection.data.002.problem.descriptor=@RequiredArgsConstructor is redundant — @Data already implies it. Remove the explicit annotation.
inspection.data.003.problem.descriptor=@AllArgsConstructor with @Data is discouraged. @Data generates setters, undermining the constructor's immutability. Consider @Value for immutable DTOs instead.
inspection.constructor.003.problem.descriptor=@AllArgsConstructor and @RequiredArgsConstructor together generate two constructors that may conflict. Lombok may produce duplicate constructor errors or silently skip one. Pick one and remove the other.
inspection.projection.001.problem.descriptor=@AllArgsConstructor on a JPQL projection class is fragile. Field reordering silently breaks @Query 'select new ClassName(...)' expressions. Consider @Value with an explicit named constructor instead.
