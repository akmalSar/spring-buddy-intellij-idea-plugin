inspection.constructor.to.builder.display.name=Constructor call can be replaced with lombok builder
inspection.constructor.to.builder.description=Reports constructor calls on @Builder-annotated classes that can be replaced with the Lombok builder pattern.
inspection.constructor.to.builder.fix.name=Replace with lombok builder
inspection.constructor.to.builder.problem.descriptor=Constructor call can be replaced with lombok builder
inspection.setter.chain.to.builder.display.name=Setter chain can be replaced with lombok builder
inspection.setter.chain.to.builder.description=Reports no-arg constructor calls followed by setter chains on lombok @Builder-annotated classes that can be collapsed into a single builder expression.
inspection.setter.chain.to.builder.fix.name=Replace with lombok builder
inspection.setter.chain.to.builder.problem.descriptor=Setter chain can be replaced with lombok builder
inspection.allargs.constructor.redundancy.display.name=Redundant @AllArgsConstructor
inspection.allargs.constructor.redundancy.description=Reports @AllArgsConstructor annotations that are redundant because an explicit all-args constructor already exists and is never used, and removing the annotation would not break Spring DI or final-field initialization.
inspection.allargs.constructor.redundancy.fix.name=Remove redundant @AllArgsConstructor
inspection.allargs.constructor.redundancy.problem.descriptor=Redundant @AllArgsConstructor annotation
inspection.builder.redundancy.display.name=Unused or redundant @Builder
inspection.builder.redundancy.description=Reports @Builder or @SuperBuilder annotations that are redundant because the class already declares an explicit builder() method, or unused because the class has zero references and no textual builder call sites in the project.
inspection.builder.redundancy.fix.name=Remove unused/redundant @Builder
inspection.builder.redundancy.problem.descriptor.explicit=Redundant @Builder — class already declares an explicit builder() method
inspection.builder.redundancy.problem.descriptor.unused=Unused @Builder — class has zero references and no builder call sites in the project
# Builder hierarchy inspections
inspection.builder.hierarchy.display.name=Lombok @Builder hierarchy issues
inspection.builder.001.problem.descriptor=@Builder on a parent class will cause subclass builders to exclude parent fields. Use @SuperBuilder on both parent and subclasses instead.
inspection.builder.002.problem.descriptor=@Builder on a subclass whose parent also has @Builder causes a constructor conflict at compile time. Use @SuperBuilder on both classes instead.
inspection.builder.003.problem.descriptor=@Builder is present but the only available constructor covers {0} fields while the class declares {1} fields. The builder will silently leave unmatched fields null. Either add an all-args constructor or move @Builder onto the partial constructor explicitly.
inspection.builder.004.problem.descriptor=@Builder on a subclass without @SuperBuilder on the parent silently excludes all parent fields from the builder. Use @SuperBuilder on both classes.
# Inheritance shadow inspections
inspection.inheritance.shadow.display.name=Lombok inheritance shadowing issues
inspection.inherit.001.problem.descriptor=Field {0} shadows the parent field of the same name. This creates two separate memory locations on the same object. Reads and writes through a parent-typed reference will silently access the wrong field.
inspection.inherit.002.problem.descriptor=Lombok generates getters/setters for the shadowing field {0}, but they are invisible when the object is accessed through the parent type. Remove the field redeclaration and annotate the parent field instead.
inspection.inherit.003.problem.descriptor=@AllArgsConstructor on this subclass only covers the subclass's own fields. Shadowed parent fields will silently remain null after construction.
inspection.inherit.004.problem.descriptor=Validation annotation on shadowing field {0} will not fire when the object is validated through a parent-typed reference. The constraint is effectively invisible to the framework in that case.
# EqualsAndHashCode inspections
inspection.eqh.display.name=Lombok @EqualsAndHashCode issues
inspection.eqh.001.problem.descriptor=@EqualsAndHashCode on a subclass excludes parent fields from equality checks unless callSuper = true is set. Two objects that differ only in parent fields will incorrectly be considered equal.
inspection.eqh.002.problem.descriptor=@Data on a subclass implies @EqualsAndHashCode without callSuper = true, silently excluding parent fields from equality. Use explicit @EqualsAndHashCode(callSuper = true) and @ToString(callSuper = true) instead.
inspection.eqh.003.eqh.problem.descriptor=Lombok-generated equals/hashCode using mutable fields breaks JPA entity identity, Hibernate session tracking, and collection behavior. Implement equals/hashCode manually using only the entity's stable identifier.
inspection.eqh.001.fix.name=Add callSuper = true
inspection.data.call.super.fix.name=Add explicit callSuper annotations
# Data annotation inspections
inspection.data.display.name=Lombok @Data issues
inspection.data.001.problem.descriptor=@Data will not generate @AllArgsConstructor when a constructor is already defined. Only @RequiredArgsConstructor is generated, which may not match developer intent. Be explicit: use @AllArgsConstructor if a full constructor is needed.
inspection.data.jpa.problem.descriptor=@Data on JPA entities is dangerous. It includes @EqualsAndHashCode and @ToString, which leads to broken collections, LazyInitializationException, StackOverflowError, and identity issues. Use explicit @Getter + @Setter (or @Value for DTOs) instead.
inspection.data.jpa.fix.name=Replace @Data with @Getter and @Setter
inspection.data.002.problem.descriptor=@RequiredArgsConstructor is redundant — @Data already implies it. Remove the explicit annotation.
inspection.data.003.problem.descriptor=@AllArgsConstructor with @Data is discouraged. @Data generates setters, undermining the constructor's immutability. Consider @Value for immutable DTOs instead.
inspection.required.args.remove.fix.name=Remove redundant @RequiredArgsConstructor
# ToString inspections
inspection.tostring.display.name=Lombok @ToString issues
inspection.tostring.001.problem.descriptor=@ToString on a subclass excludes parent fields from the string representation unless callSuper = true is set.
inspection.tostring.002.problem.descriptor=Lombok @ToString may cause a StackOverflowError due to a circular reference between {0} and {1}. Exclude one side using @ToString.Exclude.
inspection.tostring.001.fix.name=Add callSuper = true
inspection.tostring.002.fix.name=Add @ToString.Exclude to circular field
# Constructor inspections
inspection.constructor.display.name=Lombok constructor annotation issues
inspection.constructor.001.problem.descriptor=JPA and Jackson require a no-args constructor for deserialization and proxying. Add @NoArgsConstructor alongside @AllArgsConstructor.
inspection.constructor.002.problem.descriptor=@RequiredArgsConstructor generates a no-args constructor when there are no final or @NonNull fields. This is likely unintentional. Use @NoArgsConstructor explicitly to signal intent.
inspection.constructor.003.problem.descriptor=@AllArgsConstructor and @RequiredArgsConstructor together generate two constructors that may conflict. Lombok may produce duplicate constructor errors or silently skip one. Pick one and remove the other.
inspection.builder.jpa.problem.descriptor=@Builder on a JPA entity removes the no-args constructor required by JPA/Hibernate. Always combine with @NoArgsConstructor(force = true) or put @Builder on a static method / constructor.
inspection.projection.001.problem.descriptor=@AllArgsConstructor on a JPQL projection class is fragile. Field reordering silently breaks @Query 'select new ClassName(...)' expressions. Consider @Value with an explicit named constructor instead.
inspection.constructor.001.fix.name=Add @NoArgsConstructor
inspection.constructor.002.fix.name=Replace with @NoArgsConstructor
inspection.constructor.003.fix.name=Remove conflicting @RequiredArgsConstructor
inspection.builder.jpa.fix.name=Add @NoArgsConstructor for JPA entity
inspection.superbuilder.001.problem.descriptor=@SuperBuilder requires the superclass chain to also use @SuperBuilder. Add @SuperBuilder to the parent class.
# NonNull inspections
inspection.nonnull.display.name=Lombok @NonNull issues
inspection.nonnull.001.problem.descriptor=Lombok @NonNull on a primitive field is meaningless. Primitives can never be null. Remove the annotation.
inspection.nonnull.002.problem.descriptor=@NonNull and @Builder.Default on the same field will cause a NullPointerException during construction because the null check fires before the default value is applied.
inspection.nonnull.001.fix.name=Remove @NonNull
# BuilderDefault inspections
inspection.builderdefault.display.name=Lombok @Builder.Default issues
inspection.builderdefault.001.problem.descriptor=@Builder.Default is bypassed when the all-args constructor is used directly. The default value will not be applied, and the field will be whatever was passed in — including null.
inspection.builderdefault.001.fix.name=Remove @AllArgsConstructor
# Setter on builder field inspections
inspection.setter.builder.display.name=Lombok @Setter on @Builder field
inspection.setter.001.problem.descriptor=@Setter on a field in a @Builder class undermines immutability. If the field must be mutable, document this explicitly. If not, remove @Setter.
inspection.setter.001.fix.name=Remove @Setter
# BuilderDefault value erasure inspections
inspection.builderdefault.value.display.name=Lombok @Builder erases field initializers
inspection.builderdefault.value.problem.descriptor=Field initializer is erased by @Builder; add @Builder.Default to preserve the default value
inspection.builderdefault.value.fix.name=Add @Builder.Default
# Manual getter shadow inspections
inspection.manual.getter.display.name=Manual method shadows Lombok getter
inspection.manual.001.problem.descriptor=Lombok will skip generating a getter for {0} because a method with the same signature already exists. If the manual method is removed in the future, behavior will silently change to the Lombok default.
