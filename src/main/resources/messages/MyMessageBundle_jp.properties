inspection.builderdefault.001.problem.descriptor=@Builder.Default\u306F\u3001\u5168\u5F15\u6570\u30B3\u30F3\u30B9\u30C8\u30E9\u30AF\u30BF\u30FC\u304C\u76F4\u63A5\u4F7F\u7528\u3055\u308C\u308B\u3068\u30D0\u30A4\u30D1\u30B9\u3055\u308C\u307E\u3059\u3002\u30C7\u30D5\u30A9\u30EB\u30C8\u5024\u306F\u9069\u7528\u3055\u308C\u305A\u3001\u30D5\u30A3\u30FC\u30EB\u30C9\u306F\u6E21\u3055\u308C\u305F\u5024\u3092\u4FDD\u6301\u3057\u307E\u3059 \u2014 null\u3082\u542B\u307F\u307E\u3059\u3002
inspection.setter.builder.display.name=Lombok @Builder \u30D5\u30A3\u30FC\u30EB\u30C9\u306E@Setter
inspection.setter.001.problem.descriptor=@Builder\u30AF\u30E9\u30B9\u5185\u306E\u30D5\u30A3\u30FC\u30EB\u30C9\u306B@Setter\u3092\u4ED8\u3051\u308B\u3068\u3001\u4E0D\u5909\u6027\u304C\u640D\u306A\u308F\u308C\u307E\u3059\u3002\u30D5\u30A3\u30FC\u30EB\u30C9\u3092\u5909\u66F4\u53EF\u80FD\u306B\u3059\u308B\u5FC5\u8981\u304C\u3042\u308B\u5834\u5408\u306F\u660E\u793A\u7684\u306B\u30C9\u30AD\u30E5\u30E1\u30F3\u30C8\u5316\u3057\u3066\u304F\u3060\u3055\u3044\u3002\u305D\u3046\u3067\u306A\u3044\u5834\u5408\u306F@Setter\u3092\u524A\u9664\u3057\u3066\u304F\u3060\u3055\u3044\u3002
inspection.manual.getter.display.name=\u624B\u52D5\u30E1\u30BD\u30C3\u30C9\u304CLombok Getter\u3092\u30B7\u30E3\u30C9\u30A6
inspection.manual.001.problem.descriptor={0}\u306Egetter\u751F\u6210\u3092Lombok\u304C\u30B9\u30AD\u30C3\u30D7\u3057\u307E\u3059\u3002\u540C\u3058\u30B7\u30B0\u30CB\u30C1\u30E3\u3092\u6301\u3064\u30E1\u30BD\u30C3\u30C9\u304C\u3059\u3067\u306B\u5B58\u5728\u3059\u308B\u305F\u3081\u3067\u3059\u3002\u624B\u52D5\u30E1\u30BD\u30C3\u30C9\u304C\u5C06\u6765\u524A\u9664\u3055\u308C\u305F\u5834\u5408\u3001\u52D5\u4F5C\u304CLombok\u306E\u30C7\u30D5\u30A9\u30EB\u30C8\u306B\u9ED9\u3063\u3066\u5909\u66F4\u3055\u308C\u307E\u3059\u3002
inspection.superbuilder.001.problem.descriptor=@SuperBuilderはスーパークラスチェーンにも@SuperBuilderを使用する必要があります。親クラスに@SuperBuilderを追加してください。
inspection.data.jpa.problem.descriptor=@Data on JPA entities is dangerous. It includes @EqualsAndHashCode and @ToString, which leads to broken collections, LazyInitializationException, StackOverflowError, and identity issues. Use explicit @Getter + @Setter (or @Value for DTOs) instead.
inspection.builder.jpa.problem.descriptor=@Builder on a JPA entity removes the no-args constructor required by JPA/Hibernate. Always combine with @NoArgsConstructor(force = true) or put @Builder on a static method / constructor.
inspection.data.002.problem.descriptor=@RequiredArgsConstructor is redundant — @Data already implies it. Remove the explicit annotation.
inspection.data.003.problem.descriptor=@AllArgsConstructor with @Data is discouraged. @Data generates setters, undermining the constructor's immutability. Consider @Value for immutable DTOs instead.
inspection.constructor.003.problem.descriptor=@AllArgsConstructor and @RequiredArgsConstructor together generate two constructors that may conflict. Lombok may produce duplicate constructor errors or silently skip one. Pick one and remove the other.
inspection.projection.001.problem.descriptor=@AllArgsConstructor on a JPQL projection class is fragile. Field reordering silently breaks @Query 'select new ClassName(...)' expressions. Consider @Value with an explicit named constructor instead.
