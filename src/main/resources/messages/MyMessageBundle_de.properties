inspection.constructor.to.builder.display.name=Konstruktoraufruf kann durch Builder ersetzt werden
inspection.constructor.to.builder.description=Meldet Konstruktoraufrufe auf mit @Builder annotierten Klassen, die durch das Lombok-Builder-Muster ersetzt werden k\u00F6nnen.
inspection.constructor.to.builder.fix.name=Durch Builder ersetzen
inspection.constructor.to.builder.problem.descriptor=Konstruktoraufruf kann durch Builder ersetzt werden
inspection.allargs.constructor.redundancy.display.name=\u00DCberfl\u00FCssige @AllArgsConstructor
inspection.allargs.constructor.redundancy.description=Meldet @AllArgsConstructor-Annotationen, die \u00FCberfl\u00FCssig sind, weil ein expliziter All-Args-Konstruktor bereits existiert und nie verwendet wird, und das Entfernen der Annotation weder Spring DI noch Final-Feld-Initialisierung beeintr\u00E4chtigen w\u00FCrde.
inspection.allargs.constructor.redundancy.fix.name=\u00DCberfl\u00FCssige @AllArgsConstructor entfernen
inspection.allargs.constructor.redundancy.problem.descriptor=\u00DCberfl\u00FCssige @AllArgsConstructor-Annotation
inspection.builder.redundancy.display.name=Unbenutzte oder \u00FCberfl\u00FCssige @Builder
inspection.builder.redundancy.description=Meldet @Builder- oder @SuperBuilder-Annotationen, die \u00FCberfl\u00FCssig sind, weil eine explizite builder()-Methode bereits existiert, oder unbenutzt sind, weil die Klasse keine Referenzen und keine Builder-Aufrufe im Projekt hat.
inspection.builder.redundancy.fix.name=Unbenutzte/\u00FCberfl\u00FCssige @Builder entfernen
inspection.builder.redundancy.problem.descriptor.explicit=\u00DCberfl\u00FCssige @Builder \u2014 Klasse deklariert bereits eine explizite builder()-Methode
inspection.builder.redundancy.problem.descriptor.unused=Unbenutzte @Builder \u2014 Klasse hat keine Referenzen und keine Builder-Aufrufe im Projekt
inspection.builder.hierarchy.display.name=Lombok @Builder Hierarchieprobleme
inspection.builder.001.problem.descriptor=@Builder auf einer Elternklasse f\u00FChrt dazu, dass Unterklassen-Builder die Elternfelder ausschlie\u00DFen. Verwenden Sie @SuperBuilder auf Eltern- und Unterklassen.
inspection.builder.002.problem.descriptor=@Builder auf einer Unterklasse, deren Elternklasse ebenfalls @Builder hat, verursacht einen Konstruktorkonflikt zur Kompilierzeit. Verwenden Sie @SuperBuilder auf beiden Klassen.
inspection.builder.003.problem.descriptor=@Builder ist vorhanden, aber der einzige verf\u00FCgbare Konstruktor deckt {0} Felder ab, w\u00E4hrend die Klasse {1} Felder deklariert. Der Builder l\u00E4sst nicht zugeordnete Felder stillschweigend null. F\u00FCgen Sie einen All-Args-Konstruktor hinzu oder verschieben Sie @Builder explizit auf den partiellen Konstruktor.
inspection.builder.004.problem.descriptor=@Builder auf einer Unterklasse ohne @SuperBuilder auf der Elternklasse schlie\u00DFt alle Elternfelder stillschweigend aus dem Builder aus. Verwenden Sie @SuperBuilder auf beiden Klassen.
inspection.inheritance.shadow.display.name=Lombok Vererbung Shadowing-Probleme
inspection.inherit.001.problem.descriptor=Feld {0} \u00FCberschattet das Elternfeld mit dem gleichen Namen. Dies erzeugt zwei separate Speicherorte auf demselben Objekt. Lese- und Schreibzugriffe \u00FCber einen Eltern-typisierten Verweis greifen stillschweigend auf das falsche Feld zu.
inspection.inherit.002.problem.descriptor=Lombok generiert Getter/Setter f\u00FCr das \u00FCberschattende Feld {0}, aber sie sind unsichtbar, wenn das Objekt \u00FCber den Elterntyp zugegriffen wird. Entfernen Sie die Feld-Neudeklaration und annotieren Sie stattdessen das Elternfeld.
inspection.inherit.003.problem.descriptor=@AllArgsConstructor auf dieser Unterklasse deckt nur die eigenen Felder der Unterklasse ab. \u00DCberschattete Elternfelder bleiben nach der Konstruktion stillschweigend null.
inspection.inherit.004.problem.descriptor=Validierungsannotation auf dem \u00FCberschattenden Feld {0} wird nicht ausgel\u00F6st, wenn das Objekt \u00FCber einen Eltern-typisierten Verweis validiert wird. Die Einschr\u00E4nkung ist in diesem Fall f\u00FCr das Framework effektiv unsichtbar.
inspection.eqh.display.name=Lombok @EqualsAndHashCode Probleme
inspection.eqh.001.problem.descriptor=@EqualsAndHashCode auf einer Unterklasse schlie\u00DFt Elternfelder aus Gleichheitspr\u00FCfungen aus, es sei denn, callSuper = true ist gesetzt. Zwei Objekte, die sich nur in Elternfeldern unterscheiden, werden f\u00E4lschlicherweise als gleich betrachtet.
inspection.eqh.002.problem.descriptor=@Data auf einer Unterklasse impliziert @EqualsAndHashCode ohne callSuper = true und schlie\u00DFt Elternfelder stillschweigend aus der Gleichheit aus. Verwenden Sie explizite @EqualsAndHashCode(callSuper = true) und @ToString(callSuper = true).
inspection.eqh.003.eqh.problem.descriptor=Lombok-generierte equals/hashCode mit ver\u00E4nderlichen Feldern brechen JPA-Entit\u00E4tsidentit\u00E4t, Hibernate-Session-Tracking und Collection-Verhalten. Implementieren Sie equals/hashCode manuell unter Verwendung nur des stabilen Identifikators der Entit\u00E4t.
inspection.data.display.name=Lombok @Data Probleme
inspection.data.001.problem.descriptor=@Data generiert keinen @AllArgsConstructor, wenn bereits ein Konstruktor definiert ist. Es wird nur @RequiredArgsConstructor generiert, was m\u00F6glicherweise nicht der Absicht des Entwicklers entspricht. Seien Sie explizit: verwenden Sie @AllArgsConstructor, wenn ein vollst\u00E4ndiger Konstruktor ben\u00F6tigt wird.
inspection.tostring.display.name=Lombok @ToString Probleme
inspection.tostring.001.problem.descriptor=@ToString auf einer Unterklasse schlie\u00DFt Elternfelder aus der String-Repr\u00E4sentation aus, es sei denn, callSuper = true ist gesetzt.
inspection.tostring.002.problem.descriptor=Lombok @ToString kann einen StackOverflowError durch eine zirkul\u00E4re Referenz zwischen {0} und {1} verursachen. Schlie\u00DFen Sie eine Seite mit @ToString.Exclude aus.
inspection.constructor.display.name=Lombok Konstruktorannotation-Probleme
inspection.constructor.001.problem.descriptor=JPA und Jackson erfordern einen No-Args-Konstruktor f\u00FCr Deserialisierung und Proxying. F\u00FCgen Sie @NoArgsConstructor neben @AllArgsConstructor hinzu.
inspection.constructor.002.problem.descriptor=@RequiredArgsConstructor generiert einen No-Args-Konstruktor, wenn keine finalen oder @NonNull-Felder vorhanden sind. Dies ist wahrscheinlich unbeabsichtigt. Verwenden Sie explizit @NoArgsConstructor, um die Absicht zu signalisieren.
inspection.nonnull.display.name=Lombok @NonNull Probleme
inspection.nonnull.001.problem.descriptor=Lombok @NonNull auf einem primitiven Feld ist bedeutungslos. Primitive k\u00F6nnen nie null sein. Entfernen Sie die Annotation.
inspection.nonnull.002.problem.descriptor=@NonNull und @Builder.Default auf demselben Feld verursachen eine NullPointerException w\u00E4hrend der Konstruktion, da die Null-Pr\u00FCfung vor dem Standardwert ausgef\u00FChrt wird.
inspection.builderdefault.display.name=Lombok @Builder.Default Probleme
inspection.builderdefault.001.problem.descriptor=@Builder.Default wird umgangen, wenn der All-Args-Konstruktor direkt verwendet wird. Der Standardwert wird nicht angewendet, und das Feld wird den \u00FCbergebenen Wert enthalten \u2014 einschlie\u00DFlich null.
inspection.setter.builder.display.name=Lombok @Setter auf @Builder Feld
inspection.setter.001.problem.descriptor=@Setter auf einem Feld in einer @Builder Klasse untergr\u00E4bt Unver\u00E4nderlichkeit. Wenn das Feld ver\u00E4nderlich sein muss, dokumentieren Sie dies explizit. Falls nicht, entfernen Sie @Setter.
inspection.manual.getter.display.name=Manuelle Methode \u00FCberschattet Lombok Getter
inspection.manual.001.problem.descriptor=Lombok \u00FCberspringt die Getter-Generierung f\u00FCr {0}, da eine Methode mit derselben Signatur bereits existiert. Wenn die manuelle Methode in Zukunft entfernt wird, \u00E4ndert sich das Verhalten stillschweigend auf den Lombok-Standard.
inspection.superbuilder.001.problem.descriptor=@SuperBuilder erfordert, dass die Superklassen-Kette ebenfalls @SuperBuilder verwendet. Fügen Sie @SuperBuilder zur Elternklasse hinzu.
inspection.data.jpa.problem.descriptor=@Data on JPA entities is dangerous. It includes @EqualsAndHashCode and @ToString, which leads to broken collections, LazyInitializationException, StackOverflowError, and identity issues. Use explicit @Getter + @Setter (or @Value for DTOs) instead.
inspection.builder.jpa.problem.descriptor=@Builder on a JPA entity removes the no-args constructor required by JPA/Hibernate. Always combine with @NoArgsConstructor(force = true) or put @Builder on a static method / constructor.
inspection.data.002.problem.descriptor=@RequiredArgsConstructor is redundant — @Data already implies it. Remove the explicit annotation.
inspection.data.003.problem.descriptor=@AllArgsConstructor with @Data is discouraged. @Data generates setters, undermining the constructor's immutability. Consider @Value for immutable DTOs instead.
inspection.constructor.003.problem.descriptor=@AllArgsConstructor and @RequiredArgsConstructor together generate two constructors that may conflict. Lombok may produce duplicate constructor errors or silently skip one. Pick one and remove the other.
inspection.projection.001.problem.descriptor=@AllArgsConstructor on a JPQL projection class is fragile. Field reordering silently breaks @Query 'select new ClassName(...)' expressions. Consider @Value with an explicit named constructor instead.
