inspection.constructor.to.builder.display.name=La llamada al constructor puede reemplazarse con un builder
inspection.constructor.to.builder.description=Detecta llamadas a constructores en clases anotadas con @Builder que pueden reemplazarse con el patr\u00F3n builder de Lombok.
inspection.constructor.to.builder.fix.name=Reemplazar con builder
inspection.constructor.to.builder.problem.descriptor=La llamada al constructor puede reemplazarse con un builder
inspection.allargs.constructor.redundancy.display.name=@AllArgsConstructor redundante
inspection.allargs.constructor.redundancy.description=Detecta anotaciones @AllArgsConstructor redundantes porque ya existe un constructor expl\u00EDcito con todos los argumentos que nunca se usa, y eliminar la anotaci\u00F3n no romper\u00EDa la inyecci\u00F3n de Spring ni la inicializaci\u00F3n de campos finales.
inspection.allargs.constructor.redundancy.fix.name=Eliminar @AllArgsConstructor redundante
inspection.allargs.constructor.redundancy.problem.descriptor=Anotaci\u00F3n @AllArgsConstructor redundante
inspection.builder.redundancy.display.name=@Builder no usado o redundante
inspection.builder.redundancy.description=Detecta anotaciones @Builder o @SuperBuilder redundantes porque la clase ya declara un m\u00E9todo builder() expl\u00EDcito, o no usadas porque la clase no tiene referencias ni llamadas builder en el proyecto.
inspection.builder.redundancy.fix.name=Eliminar @Builder no usado/redundante
inspection.builder.redundancy.problem.descriptor.explicit=@Builder redundante \u2014 la clase ya declara un m\u00E9todo builder() expl\u00EDcito
inspection.builder.redundancy.problem.descriptor.unused=@Builder no usado \u2014 la clase no tiene referencias ni llamadas builder en el proyecto
inspection.builder.hierarchy.display.name=Problemas de jerarqu\u00EDa Lombok @Builder
inspection.builder.001.problem.descriptor=@Builder en una clase padre har\u00E1 que los builders de subclases excluyan los campos del padre. Use @SuperBuilder en ambas, la clase padre y las subclases.
inspection.builder.002.problem.descriptor=@Builder en una subclase cuyo padre tambi\u00E9n tiene @Builder causa un conflicto de constructor en tiempo de compilaci\u00F3n. Use @SuperBuilder en ambas clases.
inspection.builder.003.problem.descriptor=@Builder est\u00E1 presente pero el \u00FAnico constructor disponible cubre {0} campos mientras que la clase declara {1} campos. El builder dejar\u00E1 silenciosamente los campos no emparejados como null. Agregue un constructor all-args o mueva @Builder expl\u00EDcitamente sobre el constructor parcial.
inspection.builder.004.problem.descriptor=@Builder en una subclase sin @SuperBuilder en el padre excluye silenciosamente todos los campos del padre del builder. Use @SuperBuilder en ambas clases.
inspection.inheritance.shadow.display.name=Problemas de sombreado por herencia Lombok
inspection.inherit.001.problem.descriptor=El campo {0} sombrea el campo padre del mismo nombre. Esto crea dos ubicaciones de memoria separadas en el mismo objeto. Las lecturas y escrituras a trav\u00E9s de una referencia tipada como padre acceder\u00E1n silenciosamente al campo equivocado.
inspection.inherit.002.problem.descriptor=Lombok genera getters/setters para el campo sombreador {0}, pero son invisibles cuando se accede al objeto a trav\u00E9s del tipo padre. Elimine la redeclaraci\u00F3n del campo y anote el campo padre en su lugar.
inspection.inherit.003.problem.descriptor=@AllArgsConstructor en esta subclase solo cubre los campos propios de la subclase. Los campos padre sombreados permanecer\u00E1n silenciosamente null despu\u00E9s de la construcci\u00F3n.
inspection.inherit.004.problem.descriptor=La anotaci\u00F3n de validaci\u00F3n en el campo sombreador {0} no se activar\u00E1 cuando el objeto se valide a trav\u00E9s de una referencia tipada como padre. La restricci\u00F3n es efectivamente invisible para el framework en ese caso.
inspection.eqh.display.name=Problemas Lombok @EqualsAndHashCode
inspection.eqh.001.problem.descriptor=@EqualsAndHashCode en una subclase excluye los campos del padre de las verificaciones de igualdad a menos que se establezca callSuper = true. Dos objetos que difieren solo en campos del padre se considerar\u00E1n incorrectamente iguales.
inspection.eqh.002.problem.descriptor=@Data en una subclase implica @EqualsAndHashCode sin callSuper = true, excluyendo silenciosamente los campos del padre de la igualdad. Use @EqualsAndHashCode(callSuper = true) y @ToString(callSuper = true) expl\u00EDcitos.
inspection.eqh.003.eqh.problem.descriptor=equals/hashCode generado por Lombok usando campos mutables rompe la identidad de entidad JPA, el seguimiento de sesi\u00F3n de Hibernate y el comportamiento de colecciones. Implemente equals/hashCode manualmente usando solo el identificador estable de la entidad.
inspection.data.display.name=Problemas Lombok @Data
inspection.data.001.problem.descriptor=@Data no generar\u00E1 @AllArgsConstructor cuando ya est\u00E1 definido un constructor. Solo se genera @RequiredArgsConstructor, que puede no coincidir con la intenci\u00F3n del desarrollador. Sea expl\u00EDcito: use @AllArgsConstructor si se necesita un constructor completo.
inspection.tostring.display.name=Problemas Lombok @ToString
inspection.tostring.001.problem.descriptor=@ToString en una subclase excluye los campos del padre de la representaci\u00F3n de cadena a menos que se establezca callSuper = true.
inspection.tostring.002.problem.descriptor=Lombok @ToString puede causar un StackOverflowError debido a una referencia circular entre {0} y {1}. Excluya un lado usando @ToString.Exclude.
inspection.constructor.display.name=Problemas de anotaciones de constructor Lombok
inspection.constructor.001.problem.descriptor=JPA y Jackson requieren un constructor sin argumentos para deserializaci\u00F3n y proxying. Agregue @NoArgsConstructor junto a @AllArgsConstructor.
inspection.constructor.002.problem.descriptor=@RequiredArgsConstructor genera un constructor sin argumentos cuando no hay campos finales o @NonNull. Esto es probablemente involuntario. Use @NoArgsConstructor expl\u00EDcitamente para se\u00F1alar la intenci\u00F3n.
inspection.nonnull.display.name=Problemas Lombok @NonNull
inspection.nonnull.001.problem.descriptor=Lombok @NonNull en un campo primitivo carece de sentido. Los primitivos nunca pueden ser null. Elimine la anotaci\u00F3n.
inspection.nonnull.002.problem.descriptor=@NonNull y @Builder.Default en el mismo campo causar\u00E1n una NullPointerException durante la construcci\u00F3n porque la verificaci\u00F3n de null se ejecuta antes de que se aplique el valor predeterminado.
inspection.builderdefault.display.name=Problemas Lombok @Builder.Default
inspection.builderdefault.001.problem.descriptor=@Builder.Default se omite cuando se usa directamente el constructor all-args. El valor predeterminado no se aplicar\u00E1, y el campo tendr\u00E1 el valor pasado \u2014 incluyendo null.
inspection.setter.builder.display.name=Lombok @Setter en campo @Builder
inspection.setter.001.problem.descriptor=@Setter en un campo en una clase @Builder socava la inmutabilidad. Si el campo debe ser mutable, documente esto expl\u00EDcitamente. Si no, elimine @Setter.
inspection.manual.getter.display.name=M\u00E9todo manual oculta el getter de Lombok
inspection.manual.001.problem.descriptor=Lombok omitir\u00E1 generar un getter para {0} porque ya existe un m\u00E9todo con la misma firma. Si el m\u00E9todo manual se elimina en el futuro, el comportamiento cambiar\u00E1 silenciosamente al valor predeterminado de Lombok.
inspection.superbuilder.001.problem.descriptor=@SuperBuilder requiere que la cadena de superclases también use @SuperBuilder. Agregue @SuperBuilder a la clase padre.
inspection.data.jpa.problem.descriptor=@Data on JPA entities is dangerous. It includes @EqualsAndHashCode and @ToString, which leads to broken collections, LazyInitializationException, StackOverflowError, and identity issues. Use explicit @Getter + @Setter (or @Value for DTOs) instead.
inspection.builder.jpa.problem.descriptor=@Builder on a JPA entity removes the no-args constructor required by JPA/Hibernate. Always combine with @NoArgsConstructor(force = true) or put @Builder on a static method / constructor.
inspection.data.002.problem.descriptor=@RequiredArgsConstructor is redundant — @Data already implies it. Remove the explicit annotation.
inspection.data.003.problem.descriptor=@AllArgsConstructor with @Data is discouraged. @Data generates setters, undermining the constructor's immutability. Consider @Value for immutable DTOs instead.
inspection.constructor.003.problem.descriptor=@AllArgsConstructor and @RequiredArgsConstructor together generate two constructors that may conflict. Lombok may produce duplicate constructor errors or silently skip one. Pick one and remove the other.
inspection.projection.001.problem.descriptor=@AllArgsConstructor on a JPQL projection class is fragile. Field reordering silently breaks @Query 'select new ClassName(...)' expressions. Consider @Value with an explicit named constructor instead.
