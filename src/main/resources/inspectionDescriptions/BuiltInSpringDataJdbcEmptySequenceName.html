<p>Reports Spring Data JDBC entities that use a database-generated identifier but do not specify a sequence name.</p>
<p>When <code>@Id</code> is combined with <code>GenerationStrategy.SEQUENCE</code>, the <code>sequence</code> attribute of <code>@GeneratedValue</code> must be set so Spring Data JDBC knows which database sequence to use.</p>
