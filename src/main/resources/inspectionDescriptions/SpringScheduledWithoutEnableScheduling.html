<body>
Reports <code>@Scheduled</code> methods when the project has no <code>@EnableScheduling</code> configuration.
<p>
    Without <code>@EnableScheduling</code>, Spring does not register scheduled methods and the jobs
    never run. Add <code>@EnableScheduling</code> to a <code>@Configuration</code> or
    <code>@SpringBootApplication</code> class.
</p>
</body>
