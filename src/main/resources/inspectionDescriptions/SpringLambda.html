<body>
Enforces Spring Java Format lambda conventions:
<ul>
  <li>Single-argument lambda parameters must use parentheses: <code>(it) -&gt; ...</code> not <code>it -&gt; ...</code></li>
  <li>Single-statement lambdas should not have curly braces: <code>() -&gt; expr</code> not <code>() -&gt; { expr; }</code></li>
</ul>
