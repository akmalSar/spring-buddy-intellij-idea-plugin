<body>
Reports <code>@EnableBatchProcessing</code> in Spring Boot applications.
<p>
    Spring Boot 3 auto-configures Spring Batch. Adding <code>@EnableBatchProcessing</code> can make
    auto-configuration back off, so remove it unless the application intentionally takes full control
    of Batch infrastructure.
</p>
