<body><h2>Spring Security proxy pitfall</h2>
<p>Reports security annotations such as <code>@PreAuthorize</code>, <code>@PostAuthorize</code>, <code>@Secured</code>,
    and <code>@RolesAllowed</code> when Spring proxying may not apply them, for example on private/static/final methods
    or same-class calls.</p></body>
