<p>Reports incorrect usage of <code>@PathVariable</code> in Spring MVC controllers:</p>
<ul>
  <li>Duplicate <code>@PathVariable</code> names within the same mapping</li>
  <li>Path variable names that do not match any segment in the request mapping path</li>
  <li>Optional path variables declared on required path segments</li>
</ul>
