<body>
Reports <code>@Async</code> methods or classes when the project has no <code>@EnableAsync</code> configuration.
<p>
    Without <code>@EnableAsync</code>, Spring does not install the async proxy infrastructure and
    <code>@Async</code> methods run synchronously. Add <code>@EnableAsync</code> to a
    <code>@Configuration</code> or <code>@SpringBootApplication</code> class.
</p>
</body>
</html>
