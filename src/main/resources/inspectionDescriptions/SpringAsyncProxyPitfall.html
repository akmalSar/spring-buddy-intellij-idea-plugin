<html>
<body><h2>@Async proxy pitfall</h2>
<p>Reports <code>@Async</code> methods that may not be executed asynchronously because of Spring proxy limitations,
    including private/static/final methods and same-class self-invocation. Also warns about <code>void</code> async
    methods where exceptions require an <code>AsyncUncaughtExceptionHandler</code>.</p></body>
</html>
