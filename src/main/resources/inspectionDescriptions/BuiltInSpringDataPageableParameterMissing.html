<body>
<p>Reports Spring Data repository methods that return a <code>Page</code> or a <code>Slice</code> but do not accept a <code>Pageable</code> parameter.</p>
<p>Pagination requires a <code>Pageable</code> to determine the offset, page size, and sort order. Without it, the repository implementation throws an <code>IllegalArgumentException</code> at runtime.</p>
