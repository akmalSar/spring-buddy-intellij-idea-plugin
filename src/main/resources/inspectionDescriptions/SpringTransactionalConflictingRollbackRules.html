<h2>Conflicting rollback and no-rollback rules</h2>
<p>Reports @Transactional annotations with rollbackFor/rollbackOn and noRollbackFor/noRollbackOn rules that overlap.
    Conflicting rules make effective rollback behavior difficult to reason about. Prefer explicit, non-overlapping
    exception rules.</p>
