Reports Hibernate <code>@CollectionType(type = "...")</code> mappings that specify the collection type by string alias.
<p>
    Hibernate 6 removed string-based custom type references from mapping annotations. Replace the string alias with
    the Hibernate 6 collection type APIs, usually a <code>UserCollectionType</code> class.
</p>
